<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OshXona — Onlayn Buyurtma va Yetkazib Berish Tizimi</title>
<style>
  :root{
    --bg:#dbeeff;
    --panel:#ffffff;
    --panel-2:#eef6ff;
    --line:#c3dcf2;
    --txt:#15324a;
    --muted:#5c7a93;
    --brand:#ff6b35;
    --brand-2:#ff9f1c;
    --green:#1ca85a;
    --blue:#2e7fd6;
    --yellow:#d99500;
    --purple:#7c5cff;
    --red:#e23b5a;
    --radius:14px;
    --shadow:0 18px 40px -20px rgba(40,90,140,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 85% -5%, rgba(255,107,53,.12), transparent 60%),
      radial-gradient(700px 400px at 5% 105%, rgba(46,127,214,.16), transparent 60%),
      linear-gradient(180deg,#bfe2ff 0%, var(--bg) 100%);
    color:var(--txt);
    min-height:100vh;
    line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer;border:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  .hidden{display:none!important}

  /* ===== Topbar ===== */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:18px;
    padding:14px 22px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px}
  .logo .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;font-size:18px;color:#1a0f08;
    box-shadow:0 6px 18px -6px var(--brand);overflow:hidden;
  }
  .logo .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .logo b{background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{flex:1}
  .role-badge{
    font-size:12px;padding:6px 12px;border-radius:30px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
  }
  .role-badge b{color:var(--txt)}
  .btn{
    padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;
    background:var(--panel-2);color:var(--txt);border:1px solid var(--line);
    transition:.15s;
  }
  .btn:hover{border-color:var(--brand);color:#fff}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#1a0f08;border:none}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:var(--red);border-color:rgba(255,84,112,.4)}
  .btn.danger:hover{background:rgba(255,84,112,.12)}

  .cart-btn{position:relative}
  .cart-count{
    position:absolute;top:-7px;right:-7px;
    background:var(--brand);color:#1a0f08;font-size:11px;font-weight:800;
    min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;
  }

  main{max-width:1240px;margin:0 auto;padding:26px 22px 80px}

  /* ===== Login ===== */
  .auth-wrap{min-height:80vh;display:grid;place-items:center}
  .auth-card{
    width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:34px;box-shadow:0 24px 60px -24px rgba(40,90,140,.5);
  }
  .auth-card h2{font-size:24px;margin-bottom:6px}
  .auth-card p.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--txt);outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
  .auth-tabs{display:flex;gap:8px;margin-bottom:20px}
  .auth-tabs button{flex:1;padding:9px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-weight:600}
  .auth-tabs button.active{background:var(--brand);color:#1a0f08;border-color:var(--brand)}
  .demo-hint{margin-top:18px;padding:12px;border-radius:10px;background:var(--panel-2);font-size:12px;color:var(--muted);border:1px dashed var(--line)}
  .demo-hint b{color:var(--brand-2)}
  .demo-hint code{color:var(--txt)}
  .err{color:var(--red);font-size:13px;margin-bottom:10px;min-height:18px}

  /* ===== Shop ===== */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 13px 11px 40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--txt);outline:none}
  .search input:focus{border-color:var(--brand)}
  .search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .cats{display:flex;gap:8px;flex-wrap:wrap}
  .cat-chip{padding:8px 14px;border-radius:30px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
  .cat-chip.active{background:var(--brand);color:#1a0f08;border-color:var(--brand)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:.18s;
  }
  .card:hover{transform:translateY(-3px);border-color:rgba(255,107,53,.45);box-shadow:var(--shadow)}
  .card .thumb{height:140px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#eaf4ff,#d4e9ff);overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card .name{font-weight:700;font-size:15px}
  .card .desc{font-size:12.5px;color:var(--muted);flex:1}
  .card .meta{display:flex;justify-content:space-between;align-items:center}
  .price{font-weight:800;color:var(--brand-2);font-size:16px}
  .stock{font-size:11.5px;color:var(--muted)}
  .stock.low{color:var(--yellow)}
  .stock.out{color:var(--red)}
  .card .add{margin-top:4px;width:100%;padding:9px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-weight:600;transition:.15s}
  .card .add:hover:not(:disabled){background:var(--brand);color:#1a0f08;border-color:var(--brand)}
  .card .add:disabled{opacity:.45;cursor:not-allowed}

  /* ===== Drawer (cart) ===== */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:.2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(420px,94vw);z-index:100;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0)}
  .drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .drawer .dh h3{font-size:18px}
  .drawer .dbody{flex:1;overflow:auto;padding:16px 20px}
  .drawer .dfoot{padding:18px 20px;border-top:1px solid var(--line)}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .cart-item .ic{width:46px;height:46px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;font-size:24px;flex-shrink:0;overflow:hidden}
  .cart-item .ic img{width:100%;height:100%;object-fit:cover}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .info .n{font-weight:600;font-size:14px}
  .cart-item .info .p{font-size:12.5px;color:var(--muted)}
  .qty{display:flex;align-items:center;gap:8px;margin-top:6px}
  .qty button{width:26px;height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-size:16px;line-height:1}
  .qty span{min-width:24px;text-align:center;font-weight:600}
  .rm{color:var(--red);font-size:12px;background:none;align-self:flex-start}
  .total-row{display:flex;justify-content:space-between;margin-bottom:14px;font-size:15px}
  .total-row b{font-size:20px;color:var(--brand-2)}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}

  /* ===== Modal ===== */
  .modal-wrap{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;padding:18px}
  .modal-wrap.show{opacity:1;pointer-events:auto}
  .modal{width:min(480px,96vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
  .modal h3{font-size:20px;margin-bottom:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ===== Dash / tables ===== */
  .page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
  .page-head h1{font-size:26px}
  .page-head p{color:var(--muted);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .stat .lbl{font-size:12.5px;color:var(--muted)}
  .stat .val{font-size:28px;font-weight:800;margin-top:4px}
  .stat.a .val{color:var(--brand-2)} .stat.b .val{color:var(--blue)}
  .stat.c .val{color:var(--green)} .stat.d .val{color:var(--purple)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:9px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
  .tab.active{background:var(--panel-2);color:var(--txt);border-color:var(--brand)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:var(--panel-2)}
  tr:last-child td{border-bottom:none}
  td.actions{display:flex;gap:6px;flex-wrap:wrap}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:30px;font-size:11.5px;font-weight:700}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .s-qabul{color:var(--blue);background:rgba(74,163,255,.13)}
  .s-tasdiq{color:var(--purple);background:rgba(167,139,250,.13)}
  .s-tayyor1{color:var(--yellow);background:rgba(244,197,66,.13)}
  .s-tayyor2{color:var(--brand-2);background:rgba(255,179,71,.13)}
  .s-yolda{color:var(--brand);background:rgba(255,107,53,.13)}
  .s-yetk{color:var(--green);background:rgba(51,196,107,.13)}
  .s-bekor{color:var(--red);background:rgba(255,84,112,.13)}

  .order-detail{font-size:13px;color:var(--muted)}
  .order-detail .it{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  .order-detail .it:last-child{border:none}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel-2);border:1px solid var(--brand);color:var(--txt);padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:.25s;box-shadow:var(--shadow)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .timeline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tl-step{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .tl-step.done{color:var(--green);border-color:rgba(51,196,107,.4)}
  .tl-step.active{color:var(--brand-2);border-color:var(--brand);font-weight:700}

  .muted{color:var(--muted)}
  .right{text-align:right}
  @media(max-width:560px){.row2{grid-template-columns:1fr}th,td{padding:10px}}
</style>
</head>

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),2200);
}

function roleLabel(r){
  return {admin:"Administrator",ombor:"Ombor xodimi",kuryer:"Yetkazib beruvchi",mijoz:"Mijoz"}[r];

/* ============================================================
   MA'LUMOTLARNI SAQLASH (localStorage — brauzerda doimiy)
   ============================================================ */
const DB_KEY="oshxona_db_v1";
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ console.warn("Saqlashda xato:", e); }
}
function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw) return;
    const saved=JSON.parse(raw);
    // Saqlangan ma'lumotlarni joriy db obyektiga ko'chirish
    Object.keys(saved).forEach(k=>{ db[k]=saved[k]; });
  }catch(e){ console.warn("Yuklashda xato:", e); }
}

function renderProducts(){
  const q=shopQuery.toLowerCase();
  const list=db.products.filter(p=>
    (shopCat==="Barchasi"||p.cat===shopCat) &&
    (p.name.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q))
  );
  const g=$("#prodGrid");
  if(!list.length){ g.innerHTML=`<p class="empty" style="grid-column:1/-1">Mahsulot topilmadi.</p>`; return; }
  g.innerHTML=list.map(p=>{
    const out=p.stock<=0, low=p.stock>0&&p.stock<=8;
    const sc=out?"stock out":(low?"stock low":"stock");
    const st=out?"Tugagan":(low?`Kam qoldi: ${p.stock}`:`Mavjud: ${p.stock}`);
    return `<div class="card">
      <div class="thumb">${p.img?`<img src="images/${p.img}" alt="${p.name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${p.icon}'}))">`:p.icon}</div>

        <button class="add" data-id="${p.id}" ${out?"disabled":""}>${out?"Mavjud emas":"Savatchaga +"}</button>
      </div></div>`;
  }).join("");
  g.querySelectorAll(".add").forEach(b=>b.onclick=()=>addToCart(+b.dataset.id));
}

function renderMyOrders(){
  const mine=db.orders.filter(o=>o.userId===current.id).sort((a,b)=>b.id-a.id);
  const el=$("#myOrders");
  if(!mine.length){ el.innerHTML=`<p class="empty">Hozircha buyurtmalaringiz yo‘q.</p>`; return; }
  el.innerHTML=`<table><thead><tr><th>№</th><th>Sana</th><th>Mahsulotlar</th><th class="right">Summa</th><th>Holat</th></tr></thead><tbody>
    ${mine.map(o=>`<tr>

          <div class="timeline">${timeline(o.status)}</div></td>

      <td>${badge(o.status)}</td>

function timeline(status){
  if(status==="bekor") return `<span class="tl-step active" style="color:var(--red);border-color:var(--red)">Bekor qilindi</span>`;
  const idx=STATUSES.findIndex(s=>s.key===status);
  return STATUSES.map((s,i)=>{
    const c=i<idx?"done":(i===idx?"active":"");
    return `<span class="tl-step ${c}">${s.label}</span>`;
  }).join("");
}

   SAVATCHA
   ============================================================ */
function addToCart(pid){
  const p=findProduct(pid);
  const line=cart.find(c=>c.productId===pid);
  const inCart=line?line.qty:0;
  if(inCart+1>p.stock){ toast("Omborda yetarli mahsulot yo‘q."); return; }
  if(line) line.qty++; else cart.push({productId:pid,qty:1});
  updateCartCount(); toast(`${p.name} savatchaga qo‘shildi`);
}
function changeQty(pid,d){
  const line=cart.find(c=>c.productId===pid); if(!line)return;
  const p=findProduct(pid);
  if(d>0 && line.qty+1>p.stock){ toast("Omborda yetarli mahsulot yo‘q."); return; }
  line.qty+=d;
  if(line.qty<=0) cart=cart.filter(c=>c.productId!==pid);
  updateCartCount(); renderCart();
}
function removeLine(pid){ cart=cart.filter(c=>c.productId!==pid); updateCartCount(); renderCart(); }
function cartTotal(){ return cart.reduce((s,c)=>s+findProduct(c.productId).price*c.qty,0); }
function updateCartCount(){
  const n=cart.reduce((s,c)=>s+c.qty,0);
  const el=$("#cartCount");
  if(!el)return;
  el.textContent=n; el.classList.toggle("hidden",n===0);
}
function openCart(){ renderCart(); $("#overlay").classList.add("show"); $("#cartDrawer").classList.add("show"); }
function closeCart(){ $("#overlay").classList.remove("show"); $("#cartDrawer").classList.remove("show"); }
$("#closeCart").onclick=closeCart;
$("#overlay").onclick=closeCart;

function renderCart(){
  const body=$("#cartBody"), foot=$("#cartFoot");
  if(!cart.length){ body.innerHTML=`<p class="empty">Savatcha bo‘sh 🛒</p>`; foot.innerHTML=""; return; }
  body.innerHTML=cart.map(c=>{
    const p=findProduct(c.productId);
    return `<div class="cart-item">
      <div class="ic">${p.img?`<img src="images/${p.img}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${p.icon}'}))">`:p.icon}</div>
      <div class="info">
        <div class="n">${p.name}</div>
        <div class="p">${money(p.price)}</div>
        <div class="qty">
          <button data-m="${p.id}">−</button><span>${c.qty}</span><button data-p="${p.id}">+</button>
          <span style="flex:1"></span><button class="rm" data-r="${p.id}">O‘chirish</button>
        </div>
      </div>
      <div style="font-weight:700">${money(p.price*c.qty)}</div>
    </div>`;
  }).join("");
  body.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>changeQty(+b.dataset.m,-1));
  body.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>changeQty(+b.dataset.p,+1));
  body.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>removeLine(+b.dataset.r));
  foot.innerHTML=`
    <div class="total-row"><span>Jami:</span><b>${money(cartTotal())}</b></div>
    <button class="btn primary" style="width:100%" id="goCheckout">Buyurtma rasmiylashtirish</button>`;
  $("#goCheckout").onclick=openCheckout;
}

  if(!cart.length){ toast("Savatcha bo‘sh."); return; }
  openModal(`

    <div class="err" id="coErr"></div>
    <div class="row2">

    <div class="field"><label>To‘lov turi *</label>
      <select id="coPay"><option value="">Tanlang...</option><option>Naqd pul</option><option>Karta (yetkazganda)</option><option>Onlayn to‘lov</option></select>
    </div>
    <div class="field"><label>Izoh</label><textarea id="coNote" rows="2" placeholder="Qo‘shimcha izoh (ixtiyoriy)"></textarea></div>

      <button class="btn primary" style="flex:2" id="coConfirm">Buyurtmani tasdiqlash</button>
    </div>`);
  $("#coCancel").onclick=closeModal;

function placeOrder(){
  const fio=$("#coFio").value.trim(), phone=$("#coPhone").value.trim();
  const addr=$("#coAddr").value.trim(), pay=$("#coPay").value, note=$("#coNote").value.trim();
  // Validatsiya — TZ talabi: bo'sh maydonlar nazorat qilinadi
  if(!fio||!phone||!addr||!pay){ $("#coErr").textContent="Ism, telefon, manzil va to‘lov turi to‘ldirilishi shart."; return; }
  if(phone.replace(/\D/g,"").length<9){ $("#coErr").textContent="Telefon raqami noto‘g‘ri."; return; }
  // Ombor mavjudligini qayta tekshirish
  for(const c of cart){
    const p=findProduct(c.productId);
    if(c.qty>p.stock){ $("#coErr").textContent=`"${p.name}" omborda yetarli emas.`; return; }
  }
  // Ombordan ayirish
  cart.forEach(c=>{ findProduct(c.productId).stock-=c.qty; });
  const order={
    id:++db.seqOrder,
    userId:current.id,
    fio, phone, addr, pay, note,
    items:cart.map(c=>({productId:c.productId, qty:c.qty, price:findProduct(c.productId).price})),
    total:cartTotal(),
    status:"qabul",
    courierId:null,
    date:new Date().toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})
  };
  db.orders.push(order);
  cart=[]; updateCartCount(); closeModal(); closeCart(); saveDB();
  toast(`Buyurtma #${order.id} qabul qilindi!`);
  renderShop();
}

    <div class="row2">
      <div class="field"><label>Narx (so‘m) *</label><input id="pfPrice" type="number" value="${pr.price}"></div>
      <div class="field"><label>Qoldiq *</label><input id="pfStock" type="number" value="${pr.stock}"></div>
    </div>
    <div class="field"><label>Tavsif</label><textarea id="pfDesc" rows="2">${pr.desc}</textarea></div>
    <div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="pfCancel">Bekor</button>
      <button class="btn primary" style="flex:2" id="pfSave">Saqlash</button></div>`);
  $("#pfCancel").onclick=closeModal;
  $("#pfSave").onclick=()=>{
    const name=$("#pfName").value.trim(), price=+$("#pfPrice").value, stock=+$("#pfStock").value;
    if(!name||!price||$("#pfStock").value===""){ $("#pfErr").textContent="Nomi, narxi va qoldig‘i kiritilishi shart."; return; }
    const data={name, cat:$("#pfCat").value, price, stock, icon:$("#pfIcon").value||"🍽️", desc:$("#pfDesc").value.trim()};
    if(id) Object.assign(findProduct(id),data);
    else db.products.push({id:Math.max(...db.products.map(p=>p.id))+1,...data});
    saveDB(); closeModal(); toast("Saqlandi"); renderAdmin();
  };
}

function adminUsers(){
  $("#adminPanel").innerHTML=`<table><thead><tr><th>ID</th><th>Ism familiya</th><th>Telefon</th><th>Login</th><th>Rol</th></tr></thead><tbody>
    ${db.users.map(u=>`<tr>
      <td>#${u.id}</td><td>${u.fio}</td><td class="muted">${u.phone}</td>
      <td class="muted">${u.login}</td><td><span class="badge ${u.role==='admin'?'s-bekor':u.role==='kuryer'?'s-yolda':u.role==='ombor'?'s-tayyor1':'s-yetk'}">${roleLabel(u.role)}</span></td>
    </tr>`).join("")}
  </tbody></table>`;
}

/* ============================================================
   OMBOR XODIMI
   ============================================================ */
function renderOmbor(){
  // Tasdiqlangan / tayyorlanmoqda holatdagilar
  const list=db.orders.filter(o=>["tasdiq","tayyor1"].includes(o.status)).sort((a,b)=>a.id-b.id);
  $("#app").innerHTML=`
    <div class="page-head"><div><h1>Ombor paneli</h1><p>Tasdiqlangan buyurtmalarni tayyorlash</p></div></div>
    <div class="stats">
      <div class="stat a"><div class="lbl">Tayyorlash kutilmoqda</div><div class="val">${db.orders.filter(o=>o.status==="tasdiq").length}</div></div>
      <div class="stat b"><div class="lbl">Tayyorlanmoqda</div><div class="val">${db.orders.filter(o=>o.status==="tayyor1").length}</div></div>
    </div>
    <div class="panel" id="omPanel"></div>`;
  const p=$("#omPanel");
  if(!list.length){ p.innerHTML=`<p class="empty">Tayyorlanadigan buyurtmalar yo‘q.</p>`; return; }
  p.innerHTML=list.map(o=>`
    <div style="padding:18px 20px;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><b>Buyurtma #${o.id}</b> ${badge(o.status)}<div class="muted" style="font-size:12px">${o.date} · ${o.fio}</div></div>
        <div class="actions">
          ${o.status==="tasdiq"?`<button class="btn sm primary" data-prep="${o.id}">Tayyorlashni boshlash</button>`:""}
          ${o.status==="tayyor1"?`<button class="btn sm primary" data-ready="${o.id}">Tayyor deb belgilash</button>`:""}
        </div>
      </div>
      <div class="order-detail" style="margin-top:10px">
        ${o.items.map(i=>{const pr=findProduct(i.productId);
          return `<div class="it"><span>${pr.icon} ${pr.name} × ${i.qty}</span><span>Ombor qoldig‘i: ${pr.stock}</span></div>`;}).join("")}
      </div>
    </div>`).join("");
  p.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>{db.orders.find(o=>o.id===+b.dataset.prep).status="tayyor1";saveDB();toast("Tayyorlash boshlandi");renderOmbor();});
  p.querySelectorAll("[data-ready]").forEach(b=>b.onclick=()=>{db.orders.find(o=>o.id===+b.dataset.ready).status="tayyor2";saveDB();toast("Buyurtma tayyor!");renderOmbor();});
}

/* ============================================================
   YETKAZIB BERUVCHI (KURYER)
   ============================================================ */
function renderKuryer(){
  const mine=db.orders.filter(o=>o.courierId===current.id).sort((a,b)=>b.id-a.id);
  const active=mine.filter(o=>o.status==="yolda");
  $("#app").innerHTML=`
    <div class="page-head"><div><h1>Yetkazib berish paneli</h1><p>Sizga biriktirilgan buyurtmalar</p></div></div>
    <div class="stats">
      <div class="stat a"><div class="lbl">Yo‘lda</div><div class="val">${active.length}</div></div>
      <div class="stat c"><div class="lbl">Yetkazilgan</div><div class="val">${mine.filter(o=>o.status==="yetk").length}</div></div>
    </div>
    <div class="panel" id="kuPanel"></div>`;
  const p=$("#kuPanel");
  if(!mine.length){ p.innerHTML=`<p class="empty">Sizga biriktirilgan buyurtmalar yo‘q.</p>`; return; }
  p.innerHTML=mine.map(o=>`
    <div style="padding:18px 20px;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><b>Buyurtma #${o.id}</b> ${badge(o.status)}
          <div class="muted" style="font-size:13px;margin-top:4px">📍 ${o.addr}<br>📞 ${o.phone} · ${o.fio}</div>
          <div class="muted" style="font-size:12px">💳 ${o.pay} · ${money(o.total)}</div>
          ${o.note?`<div class="muted" style="font-size:12px">📝 ${o.note}</div>`:""}
        </div>
        <div class="actions">
          ${o.status==="yolda"?`<button class="btn sm primary" data-deliver="${o.id}">Yetkazildi deb belgilash</button>`:""}
        </div>
      </div>
      <div class="order-detail" style="margin-top:8px">
        ${o.items.map(i=>`<div class="it"><span>${findProduct(i.productId).name} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join("")}
      </div>
    </div>`).join("");
  p.querySelectorAll("[data-deliver]").forEach(b=>b.onclick=()=>{db.orders.find(o=>o.id===+b.dataset.deliver).status="yetk";saveDB();toast("Buyurtma yetkazildi! ✅");renderKuryer();});
}

/* ============================================================
   ISHGA TUSHIRISH
   ============================================================ */
loadDB();
renderAuth();
</script>
</body>
